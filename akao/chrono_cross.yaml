game: "Chrono Cross"
format: "akao_newstyle"
console_type: "psx"

# ROM table locations (PSX RAM addresses)
# The script will automatically convert these to file offsets
duration_table:
  address: 0x8006B5BC
  size: 11
  type: "ushort"

opcode_table:
  address: 0x8006B53C
  size: 96
  type: "byte"

fe_opcode_table:
  address: 0x8006B59C
  size: 32
  type: "byte"

# Opcode definitions - Chrono Cross is similar to FF9, with additional FE subcodes
opcodes:
  # FE-prefixed subcodes (0xFE00-0xFE1F)
  0xFE00: {semantic: "tempo", params: 2}
  0xFE01: {semantic: "tempo_fade", params: 3}
  0xFE02: {semantic: "reverb_volume", params: 2}
  0xFE03: {semantic: "reverb_volume_fade", params: 3}
  0xFE04: {semantic: "percussion_mode_on", params: 0}
  0xFE05: {semantic: "percussion_mode_off", params: 0}  # CC-specific
  0xFE06: {semantic: "goto", params: 2}
  0xFE07: {semantic: "conditional_branch", params: 3}
  0xFE08: {semantic: "unknown", params: 0}
  0xFE09: {semantic: "unknown", params: 0}
  0xFE0A: {semantic: "unknown", params: 0}
  0xFE0B: {semantic: "unknown", params: 0}
  0xFE0C: {semantic: "unknown", params: 0}
  0xFE0D: {semantic: "unknown", params: 0}
  0xFE0E: {semantic: "call_sub", params: 2}
  0xFE0F: {semantic: "return_sub", params: 0}
  0xFE10: {semantic: "set_next_avail_pv", params: 1}
  0xFE11: {semantic: "clear_next_avail_pv", params: 0}  # CC: 0 params (not 4 like FF8)
  0xFE12: {semantic: "track_volume_fade", params: 2}    # CC-specific
  0xFE13: {semantic: "unknown", params: 0}
  0xFE14: {semantic: "patch_change", params: 1}
  0xFE15: {semantic: "time_signature", params: 2}       # CC-specific
  0xFE16: {semantic: "measure_number", params: 1}       # CC-specific
  0xFE17: {semantic: "unknown", params: 0}
  0xFE18: {semantic: "unknown", params: 0}
  0xFE19: {semantic: "unknown", params: 0}
  0xFE1A: {semantic: "unknown", params: 0}
  0xFE1B: {semantic: "unknown", params: 0}
  0xFE1C: {semantic: "unknown", params: 0}
  0xFE1D: {semantic: "unknown", params: 0}
  0xFE1E: {semantic: "unknown", params: 0}
  0xFE1F: {semantic: "unknown", params: 0}

  # Single-byte opcodes 0xA0-0xFF
  # Notes (0x00-0x9F) handled separately
  0xA0: {semantic: "halt", params: 0}
  0xA1: {semantic: "patch_change", params: 1}
  0xA2: {semantic: "utility_duration", params: 1}
  0xA3: {semantic: "track_volume", params: 1}
  0xA4: {semantic: "unknown", params: 0}
  0xA5: {semantic: "set_octave", params: 1}
  0xA6: {semantic: "inc_octave", params: 0}
